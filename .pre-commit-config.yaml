# .pre-commit-config.yaml
repos:
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3.11
  
  - repo: local
    hooks:
      - id: pytest-check
        name: Run tests
        # Pinned to the project venv. `pytest` alone resolves from PATH, which can
        # be an older interpreter than setup.py supports; the tests then fail in
        # ways that look like broken code rather than the wrong Python.
        entry: venv/bin/python -m pytest tests
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]