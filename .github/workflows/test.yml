name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run pytest
      run: |
        pytest -v

  generated:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Regenerate schema docs
      run: |
        python generate_docs.py

    - name: Regenerate domain models
      run: |
        python generate_latest_domain.py

    - name: Check generated files are up to date
      run: |
        if [ -n "$(git status --porcelain docs/ cdf/domain/latest/)" ]; then
          echo "::error::Generated files are stale. Run 'python generate_docs.py' and 'python generate_latest_domain.py', then commit the result."
          git status --porcelain docs/ cdf/domain/latest/
          git diff -- docs/ cdf/domain/latest/
          exit 1
        fi
        echo "docs/ and cdf/domain/latest/ are up to date with cdf/files/v$(python -c 'import cdf; print(cdf.VERSION)')/schema/"

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Check formatting
      run: |
        black --check --diff cdf/ tests/ generate_docs.py generate_latest_domain.py setup.py
