name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run pytest
      run: |
        pytest -v

  generated:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    # The table PDFs render with the paper's own preamble, which pulls in 26
    # packages. MnSymbol lives in fonts-extra and authblk in latex-extra, so
    # the recommended set alone is not enough.
    - name: Cache TeX Live
      id: cache-texlive
      uses: actions/cache@v4
      with:
        path: |
          /var/cache/apt/archives/*.deb
        key: texlive-${{ runner.os }}-v1

    - name: Install TeX Live
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          texlive-latex-base \
          texlive-latex-recommended \
          texlive-latex-extra \
          texlive-fonts-recommended \
          texlive-fonts-extra
        pdflatex --version | head -1

    - name: Regenerate schema docs
      run: |
        python src/generate_docs.py

    - name: Regenerate domain models
      run: |
        python src/generate_latest_domain.py

    # Writes docs/latest/latex/*.{txt,pdf,html}. The PDFs are byte-reproducible
    # because src/generate_latex.py pins SOURCE_DATE_EPOCH; without that pdflatex
    # stamps the current time and the staleness check below could never pass.
    - name: Regenerate LaTeX tables and PDFs
      run: |
        python src/generate_latex.py

    - name: Check generated files are up to date
      run: |
        TARGETS="docs/ cdf/domain/latest/"
        if [ -n "$(git status --porcelain $TARGETS)" ]; then
          echo "::error::Generated files are stale. Run 'python src/generate_docs.py', 'python src/generate_latest_domain.py' and 'python src/generate_latex.py', then commit the result."
          git status --porcelain $TARGETS
          git diff --stat -- $TARGETS
          git diff -- $TARGETS ':(exclude)*.pdf'
          exit 1
        fi
        echo "docs/ and cdf/domain/latest/ are up to date with cdf/files/v$(python -c 'import cdf; print(cdf.VERSION)')/schema/"

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Check formatting
      run: |
        black --check --diff cdf/ tests/ src/ setup.py
