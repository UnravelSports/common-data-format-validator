name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run pytest
      run: |
        pytest -v

  generated:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    # The table PDFs render with the paper's own preamble, which pulls in 26
    # packages. MnSymbol lives in fonts-extra and authblk in latex-extra, so
    # the recommended set alone is not enough.
    - name: Regenerate schema docs
      run: |
        python src/generate_docs.py

    - name: Regenerate domain models
      run: |
        python src/generate_latest_domain.py

    # --no-pdf: pdflatex output varies with the TeX Live version that built
    # it, so CI's bytes would never match the committed ones. The PDFs are
    # regenerated on a contributor's machine instead, enforced by the
    # latex-pdfs pre-commit hook. The .txt and .html are deterministic and are
    # still byte-compared below.
    - name: Regenerate LaTeX tables
      run: |
        python src/generate_latex.py --no-pdf

    # PDFs are not regenerated here (--no-pdf above), so they cannot differ.
    # Their freshness is enforced by the latex-pdfs pre-commit hook instead.
    - name: Check generated files are up to date
      run: |
        TARGETS="docs/ cdf/domain/latest/"
        if [ -n "$(git status --porcelain -- $TARGETS)" ]; then
          echo "::error::Generated files are stale. Run 'python src/generate_docs.py', 'python src/generate_latest_domain.py' and 'python src/generate_latex.py', then commit the result."
          git status --porcelain -- $TARGETS
          git diff -- $TARGETS
          exit 1
        fi
        echo "docs/ and cdf/domain/latest/ are up to date with cdf/files/v$(python -c 'import cdf; print(cdf.VERSION)')/schema/"

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Check formatting
      run: |
        black --check --diff cdf/ tests/ src/ setup.py
